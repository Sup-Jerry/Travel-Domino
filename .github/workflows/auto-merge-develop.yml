name: Auto Merge Develop Into Main

on:
  schedule:
    # Every Monday 09:00 Asia/Shanghai (01:00 UTC).
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate merge window
        id: gate
        run: |
          set -euo pipefail
          git fetch origin main develop

          ahead_count="$(git rev-list --count origin/main..origin/develop)"
          echo "ahead_count=${ahead_count}" >> "$GITHUB_OUTPUT"

          if [ "$ahead_count" -eq 0 ]; then
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_ts="$(date +%s)"
          last_develop_ts="$(git log -1 --format=%ct origin/develop)"
          stable_hours="$(( (now_ts - last_develop_ts) / 3600 ))"
          echo "stable_hours=${stable_hours}" >> "$GITHUB_OUTPUT"

          if [ "$stable_hours" -lt 72 ]; then
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_merge=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse develop->main PR
        id: pr
        if: steps.gate.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "chore(release): auto merge develop into main" \
              --body "Scheduled auto-merge window hit. develop has been stable for >=72 hours."
            pr_number="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          fi

          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Enable PR auto-merge
        if: steps.gate.outputs.should_merge == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" --merge --auto
