name: security-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-hygiene:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret and placeholder scan
        shell: pwsh
        run: ./scripts/ci/secret-scan.ps1 -Scope Repo
